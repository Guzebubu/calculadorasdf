<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCGUSS - Laboratorio</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/MCGGUSficon.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ESTILOS DE LA PANTALLA DE CARGA TIERNA */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 110, 253, 0.95); /* Azul translúcido */
            z-index: 9999; /* Por encima de todo */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none; /* No estorba si está oculta */
            transition: opacity 0.4s ease;
            backdrop-filter: blur(5px);
        }

        /* Clase mágica para activarlo con JS */
        .loading-overlay.activa {
            opacity: 1;
            pointer-events: all;
        }

        .cute-icons i {
            font-size: 5rem;
            margin: 0 15px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Colores pastel tiernos */
        .color-dna { color: #ff7675; }  /* Rosita */
        .color-flask { color: #55efc4; } /* Menta */
        .color-bact { color: #ffeaa7; } /* Amarillito */

        /* Animación de saltito */
        @keyframes saltito {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            50% { transform: translateY(-30px) scale(1.1) rotate(10deg); }
        }

        .anim-bounce {
            display: inline-block;
            animation: saltito 1.2s infinite ease-in-out;
        }

        /* Animación de latido */
        @keyframes latido {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .anim-pulse { animation: latido 1.5s infinite; }
    </style>
</head>
<body>
    <div id="pantalla-carga" class="loading-overlay">
        <div class="loading-content text-center">
            <div class="cute-icons">
                <i class="fas fa-dna anim-bounce color-dna"></i>
                <i class="fas fa-flask anim-bounce color-flask" style="animation-delay: 0.2s"></i>
                <i class="fas fa-bacterium anim-bounce color-bact" style="animation-delay: 0.4s"></i>
            </div>
            <h4 class="mt-4 text-white fw-bold anim-pulse">cargando...</h4>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            
           <a class="navbar-brand d-flex align-items-center" href="{{ url_for('index') }}">
             <img src="{{ url_for('static', filename='img/MCGGUS.png') }}?v=2" alt="Logo Lab" height="45" class="me-2">
             <span class="fw-bold"></span>
           </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}"><i class="bi bi-droplet-half"></i> Calculadora PCR</a></li>
                    
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('lv1_page') }}"><i class="bi bi-1-circle"></i> Nivel 1</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('lv2_page') }}"><i class="bi bi-2-circle"></i> Nivel 2</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('medios_page') }}"><i class="bi bi-flower1"></i> Medios de Cultivo</a></li>
                    <li class="nav-item"><a class="nav-link" href="/molaridad"><i class="bi bi-heptagon-half"></i> Molaridad</a></li>
                    <li class="nav-item"><a class="nav-link" href="/calculos_generales"><i class="bi bi-tools"></i> Cálculos Generales</a></li>
                    <li class="nav-item"><a class="nav-link" href="/recetas"><i class="bi bi-journal-text"></i> Recetas de Laboratorio</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="text-center p-3 bg-primary text-white">
            © 2026 Laboratorio SDF - MCGGUS
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
