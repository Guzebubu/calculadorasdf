<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCGUSS - Laboratorio</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/MCGGUSficon.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Clases utilitarias para transiciones suaves de las tarjetas */
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hover-card:hover { transform: translateY(-5px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important; transition: all .3s ease; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
        <div class="container">
            
           <!-- EL LOGO APUNTA AL HOME -->
           <a class="navbar-brand d-flex align-items-center" href="{{ url_for('home') }}">
             <img src="{{ url_for('static', filename='img/MCGGUS.png') }}?v=2" alt="Logo Lab" height="45" class="me-2">
             <span class="fw-bold"></span>
           </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link fw-bold text-white" href="{{ url_for('home') }}"><i class="bi bi-house-door-fill"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}"><i class="bi bi-droplet-half"></i> PCR</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('lv1_page') }}"><i class="bi bi-1-circle"></i> Nivel 1</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('lv2_page') }}"><i class="bi bi-2-circle"></i> Nivel 2</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('medios_page') }}"><i class="bi bi-flower1"></i> Medios</a></li>
                    <li class="nav-item"><a class="nav-link" href="/molaridad"><i class="bi bi-heptagon-half"></i> Molaridad</a></li>
                    <li class="nav-item"><a class="nav-link" href="/calculos_generales"><i class="bi bi-tools"></i> Generales</a></li>
                    <li class="nav-item"><a class="nav-link" href="/recetas"><i class="bi bi-journal-text"></i> Recetas</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="text-center p-3 bg-primary text-white shadow-lg">
            © 2026 Laboratorio SDF - MCGGUS
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
